type: single
input mesh file: ../../../../../../torsion-hex-conformal-2.g
output mesh file: torsion-2.e
CSV output interval: 2.0e-6
CSV write sidesets: false
model:
  type: quadratic opinf rom 
  model-file: /home/andiaz/tpls/norma-opinf/examples/non-overlapping/torsion/a5500_5500/fom-rom/with-output/dynamic-neohookean-fom-rom-hex-hex-equal-201-snap/impl-expl-dt-2em6-1em6-DN-predictor/relax1/quadratic-opinf-2-multi-reg.npz
  stress recovery: consistent
  material:
    blocks:
      top: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  # type: Newmark
  # β: 0.25
  # γ: 0.5
  # time step: 2.0e-6
  # decrease factor: 0.5
  # increase factor: 1.2
  # minimum time step: 1.0e-9
  # maximum time step: 1.0e-5
  type: central difference
  CFL: 0.1
  γ: 0.5
  time step: 1.0e-6
  decrease factor: 0.5
  increase factor: 1.2
  minimum time step: 1.0e-9
  maximum time step: 1.0e-5
initial conditions:
  displacement:
    - node set: nsall
      component: x
      function: "0.0"
    - node set: nsall
      component: y
      function: "0.0"
    - node set: nsall
      component: z
      function: "0.0"
  velocity:
    - node set: nsall
      component: x
      function: "a=5500; -a*y*z"
    - node set: nsall
      component: y
      function: "a=5500; a*x*z"
    - node set: nsall
      component: z
      function: "0.0"
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: -Z_ss
      source: torsion-1
      source block: bottom
      source side set: +Z_ss
      default BC type: Neumann
solver:
  type: explicit solver
  step: explicit
  # type: Hessian minimizer
  # step: full Newton
  # minimum iterations: 1
  # maximum iterations: 128
  # relative tolerance: 1.0e-10
  # absolute tolerance: 1.0e-06
