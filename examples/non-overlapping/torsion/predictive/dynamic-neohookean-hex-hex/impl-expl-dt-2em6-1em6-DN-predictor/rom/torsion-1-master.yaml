type: single
input mesh file: /home/andiaz/tpls/norma-opinf/examples/non-overlapping/torsion/torsion-hex-conformal-1.g
output mesh file: torsion-1.e
CSV output interval: 2.0e-6
CSV write sidesets: true
model:
  type: solid mechanics
  # nodal recovery: consistent
  material:
    blocks:
      bottom: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: Newmark
  β: 0.25
  γ: 0.5
  time step: 2.0e-6
  decrease factor: 0.5
  increase factor: 1.2
  minimum time step: 2.0e-8
  maximum time step: 2.0e-5
initial conditions:
  displacement:
    - node set: nsall
      component: x
      function: "0.0"
    - node set: nsall
      component: y
      function: "0.0"
    - node set: nsall
      component: z
      function: "0.0"
  velocity:
    - node set: nsall
      component: x
      function: "a=5500; -a*y*z"
    - node set: nsall
      component: y
      function: "a=5500; a*x*z"
    - node set: nsall
      component: z
      function: "0.0"
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: +Z_ss
      source: torsion-2
      source block: top
      source side set: -Z_ss
      default BC type: Dirichlet
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 128
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
