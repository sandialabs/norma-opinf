type: single
input mesh file: ../../../../../upper.g 
output mesh file: tension-specimen-2.e 
CSV output interval: 0.01
CSV write sidesets: true
model:
  type: linear opinf rom
  model-file: ../linear-opinf-2.npz
  stress recovery: consistent
  material:
    blocks:
      upper: hyperelastic
    hyperelastic:
      model: linear elastic 
      elastic modulus: 70.0e9
      Poisson's ratio: 0.36
      density: 2700.0
time integrator:
  type: Newmark
  β: 0.25
  γ: 0.5
  decrease factor: 0.5
  increase factor: 1.2
  minimum time step: 1.0e-6
  maximum time step: 0.01
boundary conditions:
  Dirichlet:
    - node set: sym_x_upper
      component: x
      function: "0.0"
    - node set: sym_z_upper
      component: z
      function: "0.0"
    - node set: upper_grip
      component: y
      function: "0.005 * 0.5 * (1.0 - cos(pi*t))"
  Schwarz DN nonoverlap:
    - side set: schwarz_upper_ss
      source: tension-specimen-1
      source side set: schwarz_lower_ss 
      source block: lower
      search tolerance: 5.0e-02
      default BC type: Dirichlet
solver:
  type: Hessian minimizer
  step: full Newton
  # use line search: true
  use line search: true
  line search backtrack factor: 0.5
  line search decrease factor: 1.0e-04
  line search maximum iterations: 16
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-07
  absolute tolerance: 1.0e-05
